<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva tu Mesa | Burger DavidG</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>

    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand fw-bold text-primary" href="index.html">BURGER DAVIDG</a>
                <div class="navbar-nav ms-auto">
                    <a class="nav-link" href="index.html">Inicio</a>
                </div>
            </div>
        </nav>
    </header>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <h1 class="mb-4">Reserva tu mesa</h1>
                <p class="text-muted">Rellena el formulario para asegurar tu sitio. Te enviaremos una confirmación al correo.</p>
                
                <form class="row g-3 needs-validation" novalidate>
                    <div class="col-md-6">
                        <label for="nombre" class="form-label">Nombre</label>
                        <input type="text" class="form-control" id="nombre" placeholder="Tu nombre" required>
                        <div class="invalid-feedback">Por favor, dinos quien eres.</div>
                    </div>

                    <div class="col-md-6">
                        <label for="email" class="form-label">Correo electrónico</label>
                        <input type="email" class="form-control" id="email" placeholder="email@ejemplo.com" required>
                        <div class="invalid-feedback">Introduce un correo válido.</div>
                    </div>

                    <div class="col-md-4">
                        <label for="fecha" class="form-label">Fecha</label>
                        <input type="date" class="form-control" id="fecha" required>
                    </div>

                    <div class="col-md-4">
                        <label for="personas" class="form-label">Personas</label>
                        <select class="form-select" id="personas" required>
                            <option selected disabled value="">Elegir...</option>
                            <option>1-2</option>
                            <option>3-4</option>
                            <option>Más de 5</option>
                        </select>
                        <div class="invalid-feedback">Selecciona cuántos vendríais.</div>
                    </div>

                    <div class="col-12 mt-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" value="" id="terminos" required>
                            <label class="form-check-label" for="terminos">
                                Acepto la política de privacidad (Accesibilidad)
                            </label>
                        </div>
                    </div>

                    <div class="col-12">
                        <button class="btn btn-primary btn-lg" type="submit">Confirmar Reserva</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script>
        (function () {
          'use strict'
          var forms = document.querySelectorAll('.needs-validation')
          Array.prototype.slice.call(forms).forEach(function (form) {
            form.addEventListener('submit', function (event) {
              if (!form.checkValidity()) {
                event.preventDefault()
                event.stopPropagation()
              }
              form.classList.add('was-validated')
            }, false)
          })
        })()
    </script>
    <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
